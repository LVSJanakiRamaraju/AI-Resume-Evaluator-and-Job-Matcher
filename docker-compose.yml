services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-resume_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: resume_server
    restart: always
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/resume_db}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: ${SERVER_PORT:-5000}
    depends_on:
      - postgres
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    command: ["npm", "start"]

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:${SERVER_PORT:-5000}}
    container_name: resume_client
    restart: always
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-5173}:80"

volumes:
  postgres_data:
